name: Build Something PC IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "FEX"
      - "wine"
      - "research/dxmt"
      - "app/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test library discovery, import, PE validation and registry restoration
        run: |
          swiftc app/Madeira/GameLibraryCore.swift build/app-tests/main.swift -o /tmp/app-tests
          /tmp/app-tests
      - name: Typecheck complete iOS interface
        if: always()
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -swift-version 5 \
            -target arm64-apple-ios17.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -import-objc-header app/Madeira/Madeira-Bridging-Header.h app/Madeira/*.swift

  prepare-arm64-runtime:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Collect verified Microsoft ARM64 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.arm64.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Microsoft ARM64 installer signature validation failed"
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/install","/quiet","/norestart" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010,1638)) { throw "ARM64 installation failed: $($process.ExitCode)" }
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\arm64'
          if ($runtime.Installed -ne 1 -or $runtime.Major -ne 14) { throw "ARM64 runtime is not installed" }
          $folder = Join-Path $env:GITHUB_WORKSPACE "ARM64Runtime"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $required = @("concrt140.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","msvcp140_atomic_wait.dll","msvcp140_codecvt_ids.dll","vcruntime140.dll")
          foreach ($optional in @("vcomp140.dll","vccorlib140.dll","vcruntime140_1.dll","vcruntime140_threads.dll","vcamp140.dll")) {
            if (Test-Path -LiteralPath (Join-Path $env:WINDIR "System32/$optional")) { $required += $optional }
          }
          $hashes = @{}
          foreach ($name in $required) {
            $source = Join-Path $env:WINDIR "System32/$name"
            $signature = Get-AuthenticodeSignature -LiteralPath $source
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") { throw "Invalid DLL signature: $name" }
            $bytes = [IO.File]::ReadAllBytes($source)
            $offset = [BitConverter]::ToInt32($bytes,60)
            $machine = [BitConverter]::ToUInt16($bytes,$offset+4)
            if ($machine -notin @(0xaa64,0xa64e)) {
              if ($name -in @("vcomp140.dll","vccorlib140.dll","vcruntime140_1.dll","vcruntime140_threads.dll","vcamp140.dll")) {
                Write-Output "Skipping non-ARM64 optional DLL: $name machine=$machine"
                continue
              }
              throw "Not ARM64/ARM64X: $name machine=$machine"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $folder $name)
            $hashes[$name] = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{
            version=$runtime.Version; major=$runtime.Major; minor=$runtime.Minor; build=$runtime.Bld; revision=$runtime.Rbld
            files=$hashes; installerSha256=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $folder "manifest.json") -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-runtime
          path: ARM64Runtime
          if-no-files-found: error

  prepare-vc-runtime:
    runs-on: windows-latest
    steps:
      - name: Download Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://aka.ms/vc14/vc_redist.x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          $expectedSha256 = "843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actualSha256 = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Microsoft VC++ Redistributable SHA-256 mismatch."
          }

      - name: Install and collect Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          $install = Start-Process -FilePath $exe -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
            throw "VC++ Redistributable installation failed with exit code $($install.ExitCode)."
          }

          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "runtime\x86_64-vcruntime"
          Remove-Item -Path $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          $required = @(
            "concrt140.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcamp140.dll",
            "vccorlib140.dll",
            "vcomp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll"
          )

          foreach ($dllName in $required) {
            $source = Join-Path $env:WINDIR ("System32\" + $dllName)
            if (-not (Test-Path -LiteralPath $source)) {
              throw ("Required x64 VC++ DLL was not installed: " + $dllName)
            }
            $signature = Get-AuthenticodeSignature -FilePath $source
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
              throw ("Authenticode validation failed for " + $dllName)
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $runtimeDir $dllName) -Force
          }

      - name: Collect verified runtime installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folder = Join-Path $env:GITHUB_WORKSPACE "runtime/RuntimeInstallers"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe") -Destination (Join-Path $folder "VC_redist.x64.exe")
          $arm64 = Join-Path $folder "VC_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.arm64.exe" -OutFile $arm64
          foreach ($installer in Get-ChildItem -LiteralPath $folder -Filter "*.exe") {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
              throw "Invalid Microsoft installer signature: $($installer.Name)"
            }
            Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          }
      - name: Upload runtime installers
        uses: actions/upload-artifact@v4
        with:
          name: runtime-installers
          path: runtime/RuntimeInstallers
          if-no-files-found: error

      - name: Upload VC++ runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vc-runtime-x64
          path: runtime/x86_64-vcruntime
          if-no-files-found: error

  controllers:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows controller bridge
        run: bash build/controller/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: controller-support
          path: app/Madeira/ControllerSupport
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: controller-test
          path: build/controller/out/controller-test.exe
          if-no-files-found: error

  controller-tests:
    needs: controllers
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controller-test
      - name: Exercise XInput shared-state bridge
        shell: pwsh
        run: |
          ./controller-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Controller bridge tests failed" }

  native:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: [fex, wine, dxmt]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record toolchain
        id: sdk
        run: |
          xcodebuild -version
          echo "version=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - name: Cache completed native component
        id: native-cache
        uses: actions/cache@v4
        with:
          path: build/ci-${{ matrix.component }}.tar
          key: native-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ matrix.component }}-${{ hashFiles('build/ci/**', 'build/wineserver/**', 'build/ntdll-unix/**', 'build/win32u-unix/**', 'build/dxmt-ios/**', 'build/gnutls-ios/**', 'build/freetype-ios/**', '.gitmodules') }}-053c385-7817e22-b4b89f0
      - name: Restore crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true'
        id: crypto-cache
        uses: actions/cache@v4
        with:
          path: toolchains/gnutls-ios
          key: crypto-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('build/gnutls-ios/**') }}
      - name: Build crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true' && steps.crypto-cache.outputs.cache-hit != 'true'
        run: bash build/gnutls-ios/build.sh
      - name: Save completed crypto dependencies
        if: matrix.component == 'wine' && steps.native-cache.outputs.cache-hit != 'true' && steps.crypto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchains/gnutls-ios
          key: ${{ steps.crypto-cache.outputs.cache-primary-key }}
      - name: Restore LLVM iOS dependencies
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: llvm15-v1-${{ runner.arch }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('build/ci/build-llvm.sh') }}
      - name: Build LLVM for iOS
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash build/ci/build-llvm.sh
      - name: Save completed LLVM dependencies
        if: matrix.component == 'dxmt' && steps.native-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build native component
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          bash "build/ci/build-$COMPONENT.sh"
          case "$COMPONENT" in
            fex) tar -cf build/ci-fex.tar FEX/build-ios ;;
            wine) tar -cf build/ci-wine.tar app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a app/Madeira/libgmp.a app/Madeira/libnettle.a app/Madeira/libhogweed.a app/Madeira/libgnutls.a ;;
            dxmt) tar -cf build/ci-dxmt.tar app/Madeira/libdxmt_combined.a ;;
          esac
      - name: Upload native component
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.component }}
          path: build/ci-${{ matrix.component }}.tar
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.component }}
          path: |
            build/**/*.err
            build/**/err-*.txt
            build/**/*.log
            wine/build-macos/config.log
            toolchains/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    needs: [prepare-vc-runtime, prepare-arm64-runtime, native, controllers, controller-tests, app-tests]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/native-artifacts
          merge-multiple: true
      - name: Install native libraries
        run: |
          set -euo pipefail
          for archive in build/native-artifacts/*.tar; do
            tar -xf "$archive"
          done
      - uses: actions/download-artifact@v4
        with:
          name: vc-runtime-x64
          path: app/Madeira/x86_64-vcruntime
      - name: Verify Microsoft runtime architecture
        run: |
          set -euo pipefail
          for dll in app/Madeira/x86_64-vcruntime/*.dll; do
            file "$dll" | grep -q x86-64
          done
      - uses: actions/download-artifact@v4
        with:
          name: controller-support
          path: app/Madeira/ControllerSupport
      - uses: actions/download-artifact@v4
        with:
          name: runtime-installers
          path: app/Madeira/RuntimeInstallers
      - uses: actions/download-artifact@v4
        with:
          name: arm64-runtime
          path: app/Madeira/ARM64Runtime
      - name: Build and validate unsigned IPA
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER" app/Madeira/Info.plist
          /usr/libexec/PlistBuddy -c "Add SomethingPCBuildCommit string $GITHUB_SHA" app/Madeira/Info.plist
          bash build/ci/package.sh
          test -s build/DerivedData/Build/Products/Release-iphoneos/Madeira.app/ARM64Runtime/manifest.json
          test -s build/DerivedData/Build/Products/Release-iphoneos/Madeira.app/Assets.car
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' build/DerivedData/Build/Products/Release-iphoneos/Madeira.app/Info.plist)" = "Something PC"
          mv build/IPA/Madeira.ipa build/IPA/SomethingPC.ipa
          (cd build/IPA && shasum -a 256 SomethingPC.ipa > SomethingPC.ipa.sha256)
      - name: Preserve IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SomethingPC-unsigned
          path: |
            build/IPA/SomethingPC.ipa
            build/IPA/SomethingPC.ipa.sha256
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Something PC unsigned IPA build ${{ github.run_number }}" \
            --notes "Something PC 0.4: one card per game folder, installer/redist filtering, selectable launch EXE, and hide/restore library entries. Fullscreen startup uses real milestone progress; 100% means the first frame, not the end of a game's own loading. Fullscreen play has a session menu; developer tools are separate. Settings are organized by category. Support reports include startup stages, effective settings, device/build/runtime information, library inventory, memory/thermal history, and available iOS diagnostics. JIT allocation failure no longer forcibly closes the app. Android drivers are not ported; reported game/graphics crashes are not claimed fixed. Back up app documents before updating. Requires signing and the existing JIT setup." \
            build/IPA/SomethingPC.ipa build/IPA/SomethingPC.ipa.sha256
          mkdir -p build/release-verification
          gh release download "$RELEASE_TAG" --dir build/release-verification \
            --pattern SomethingPC.ipa --pattern SomethingPC.ipa.sha256
          cd build/release-verification
          shasum -a 256 -c SomethingPC.ipa.sha256
          cmp SomethingPC.ipa ../IPA/SomethingPC.ipa
          gh release view "$RELEASE_TAG" --json url,assets
      - name: Preserve iOS debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: ignore
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
