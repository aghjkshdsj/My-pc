name: Fresh source-built Linux ARM payload
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/tools/build_guest_gate.sh', '.github/workflows/steamos-linux-source-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev make flex bison bc libssl-dev libelf-dev qemu-system-arm
      - name: Build and test disposable ARM Linux payload
        run: bash steamos-ios/tools/build_guest_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Source-Built-ARM-Linux-Gate
          path: |
            steamos-ios/out/source-guest/Linux-Gate-*.tar.gz
            steamos-ios/out/source-guest/SHA256SUMS
            steamos-ios/out/source-guest/UPSTREAM-SHA256SUMS
            steamos-ios/out/source-guest/kernel.config
            steamos-ios/out/source-guest/busybox.config
            steamos-ios/out/source-guest/payload/payload-receipt.json
            steamos-ios/out/source-guest/payload/kernel-test.json
            steamos-ios/out/source-guest/payload/serial.log
          retention-days: 14
