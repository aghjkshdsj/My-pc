name: Publish Steam IPA build 44

on:
  push:
    branches: [codex/steam-ios-integration]
    paths:
      - ".github/workflows/publish-steam-build44.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-steam-build44
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aghjkshdsj/My-pc' && github.ref == 'refs/heads/codex/steam-ios-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_RUN: "36210469316"
      SOURCE_SHA: "6b707efb86ebbc9cb67921da4175ef326583d58b"
      RELEASE_TAG: build-44
      GH_REPO: aghjkshdsj/My-pc
    steps:
      - name: Verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open("source-run.json"))
          assert run["id"] == int(os.environ["SOURCE_RUN"])
          assert run["run_number"] == 44
          assert run["path"] == ".github/workflows/build-ipa.yml"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["head_sha"] == os.environ["SOURCE_SHA"]
          assert run["repository"]["full_name"] == os.environ["GH_REPO"]
          print("Verified successful IPA build 44 and exact source commit")
          PY
      - name: Download the existing IPA artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10896115276"
          run-id: "36210469316"
          repository: aghjkshdsj/My-pc
          github-token: ${{ github.token }}
          path: download
          merge-multiple: true
      - name: Verify checksum and actual IPA contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, zipfile
          root = pathlib.Path("download")
          ipa = root / "SomethingPC.ipa"
          checksum = (root / "SomethingPC.ipa.sha256").read_text().strip()
          match = re.fullmatch(r"([a-fA-F0-9]{64})\s+\*?SomethingPC\.ipa", checksum)
          assert match is not None, "Unexpected checksum file"
          with ipa.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          assert digest == match[1].lower(), "IPA checksum mismatch"
          with zipfile.ZipFile(ipa) as archive:
              plists = [name for name in archive.namelist()
                        if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)]
              assert len(plists) == 1, "Expected one iPhone app payload"
              info = plistlib.loads(archive.read(plists[0]))
              assert str(info["CFBundleVersion"]) == "44", "Incorrect IPA build"
              assert info["SomethingPCBuildCommit"] == os.environ["SOURCE_SHA"]
              app = str(pathlib.PurePosixPath(plists[0]).parent)
              executable = info["CFBundleExecutable"]
              assert executable == pathlib.PurePosixPath(executable).name
              assert app + "/" + executable in archive.namelist(), "App executable missing"
              assert app + "/madeira-jit.js" in archive.namelist(), "JIT script missing"
              assert archive.testzip() is None, "Damaged IPA archive"
          print(f"Verified SomethingPC.ipa: {ipa.stat().st_size} bytes, SHA-256 {digest}")
          PY
      - name: Create release with direct IPA asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Steam integration build 44, from commit 6b707efb86ebbc9cb67921da4175ef326583d58b.

          Download **SomethingPC.ipa** from Assets directly. The accompanying .sha256 file verifies the download.

          Includes Standard Steam / experimental Big Picture, required FEX JIT checks, StikDebug controls, separate web-interface JIT selection, and Steam-managed launching for games with matching local installation manifests.

          Reuses the exact IPA from successful Actions run 36210469316. Its SHA-256, iPhone app payload, build number, source commit, and bundled JIT script were verified before upload.

          This is an unsigned experimental build from the Steam integration branch. Sign it using your existing setup and enable JIT through StikDebug. Steam login, downloads, game compatibility, and performance still require iPhone testing.
          NOTES
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --prerelease \
            --title "Something PC Steam integration — build 44" --notes-file release-notes.md \
            download/SomethingPC.ipa download/SomethingPC.ipa.sha256
          mkdir verified-release
          gh release download "$RELEASE_TAG" --dir verified-release \
            --pattern SomethingPC.ipa --pattern SomethingPC.ipa.sha256
          cmp download/SomethingPC.ipa verified-release/SomethingPC.ipa
          (cd verified-release && sha256sum -c SomethingPC.ipa.sha256)
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
