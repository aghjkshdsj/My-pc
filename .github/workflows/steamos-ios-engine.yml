name: Fresh iOS Linux CPU engine build
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/tools/prepare_engine_build.py', '.github/workflows/steamos-ios-engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-qemu-engine:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          brew install meson ninja cmake gettext glib bison
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix glib)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Prepare source-pinned engine recipe
        run: python3 steamos-ios/tools/prepare_engine_build.py steamos-ios/out/cpu-engine
      - name: Compile ARM64 iOS TCG engine
        run: |
          cd steamos-ios/out/cpu-engine
          IOS_SDKMINVER=26.0 NCPU=3 bash scripts/build_cpu_gate.sh -p ios -a arm64
      - name: Verify built engine and retain corresponding source
        run: |
          root=steamos-ios/out/cpu-engine
          engine="$(find "$root/sysroot-iOS-arm64/Frameworks" -type f -name 'qemu-aarch64-softmmu' -print -quit)"
          test -n "$engine"
          file "$engine" | tee "$root/engine-architecture.txt"
          xcrun vtool -show-build "$engine" | tee "$root/engine-platform.txt"
          grep -q 'platform IOS' "$root/engine-platform.txt"
          nm -gU "$engine" | tee "$root/engine-exports.txt"
          grep -q '_qemu_init' "$root/engine-exports.txt"
          grep -q '_qemu_main_loop' "$root/engine-exports.txt"
          otool -L "$engine" | tee "$root/engine-dependencies.txt"
          test -z "$(grep -E 'Hypervisor|/opt/homebrew|/usr/local' "$root/engine-dependencies.txt" || true)"
          tar -czf "$root/CPU-Engine-Corresponding-Source.tar.gz" -C "$root" scripts patches recipe-receipt.json build-iOS-arm64
          tar -czf "$root/CPU-Engine-iOS-Frameworks.tar.gz" -C "$root/sysroot-iOS-arm64" Frameworks
          (cd "$root" && shasum -a 256 CPU-Engine-*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fresh-iOS-CPU-Engine
          path: |
            steamos-ios/out/cpu-engine/recipe-receipt.json
            steamos-ios/out/cpu-engine/engine-*.txt
            steamos-ios/out/cpu-engine/CPU-Engine-*.tar.gz
            steamos-ios/out/cpu-engine/SHA256SUMS
            steamos-ios/out/cpu-engine/build-iOS-arm64/qemu-10.0.12-utm/build/meson-logs/meson-log.txt
          retention-days: 14
