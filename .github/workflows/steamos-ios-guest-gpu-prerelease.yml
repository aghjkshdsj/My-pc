name: Fresh iPhone Linux guest Vulkan gate prerelease
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/Host/**', 'steamos-ios/MyPCSteamOS.xcodeproj/**', 'steamos-ios/tools/bundle_guest_gpu.py', 'steamos-ios/tools/verify_ipa.py', 'steamos-ios/tools/verify_host_symbols.py', 'steamos-ios/tests/test_host_symbols.py', 'steamos-ios/tests/Guest*Tests.mm', 'steamos-ios/tests/GuestImageReadbackBudgetTests.c', 'steamos-ios/tests/GuestFrameBudgetTests.c', 'steamos-ios/tests/frame_sequence_fixture.json', 'steamos-ios/tests/RecoveryJournalTests.swift', 'steamos-ios/tests/GuestMetalTraceLedgerTests.cpp', 'steamos-ios/tests/test_guest*.py', 'steamos-ios/tests/test_failed_image_controls.py', 'steamos-ios/tests/test_failed_image_progress.py', 'steamos-ios/tools/verify_guest*.py', 'steamos-ios/tools/verify_failed_image_progress.py', 'steamos-ios/tools/verify_failed_screen_progress.py', 'steamos-ios/tests/test_failed_screen_progress.py', '.github/workflows/steamos-ios-guest-gpu-prerelease.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: steamos-guest-gpu-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guest-gpu-ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact successful source builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          pins = {
              'gpu-engine': (37244178261, 'e31b9fcc6609b8ab50f8d6f72acd7cf9f1124300'),
              'gpu-guest': (37233435975, '8759ffe84d360ca61e0d7de7b2f3347682916cde'),
              'cpu-guest': (37014232445, '33c54e5be2d022bc19bcf3e1a448163016dc84af'),
              'molten': (37178467526, '3f83d181b40439f868fba52abe54f02e9b857c36'),
          }
          for name, (run, commit) in pins.items():
              row=json.loads(subprocess.check_output(['gh','api',f'repos/aghjkshdsj/My-pc/actions/runs/{run}']))
              assert row['conclusion']=='success' and row['head_sha']==commit
              open(name+'-run.json','w').write(json.dumps(row,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Fresh-iOS-Native-Scanout-Engine
          run-id: 37244178261
          github-token: ${{ github.token }}
          path: steamos-ios/out/gpu-engine-artifact
      - uses: actions/download-artifact@v4
        with:
          name: Fresh-ARM-Linux-Frame-Payload
          run-id: 37233435975
          github-token: ${{ github.token }}
          path: steamos-ios/out/gpu-guest-artifact
      - uses: actions/download-artifact@v4
        with:
          name: Source-Built-ARM-Linux-Gate
          run-id: 37014232445
          github-token: ${{ github.token }}
          path: steamos-ios/out/cpu-guest-artifact
      - uses: actions/download-artifact@v4
        with:
          name: Fresh-iOS-MoltenVK-Guest-Metal-Observer
          run-id: 37178467526
          github-token: ${{ github.token }}
          path: steamos-ios/out/graphics-artifact
      - uses: actions/download-artifact@v4
        with:
          name: hosted-arm-vulkan-diagnostic
          run-id: 37035517982
          github-token: ${{ github.token }}
          path: steamos-ios/out/shader-artifact
      - name: Prepare exact Vulkan headers and shaders
        run: python3 steamos-ios/tools/bundle_native_vulkan.py prepare steamos-ios/out/graphics-artifact steamos-ios/out/shader-artifact --guest-metal-observer
      - name: Exercise production recovery and receipt rejection
        run: |
          python3 -m unittest discover -s steamos-ios/tests -p 'test_*.py' -v
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Isteamos-ios/Host steamos-ios/Host/ProbeRecovery.mm steamos-ios/tests/RecoveryCaptureTests.mm -o /tmp/mpc-capture-tests
          swiftc steamos-ios/Host/RecoveryJournal.swift steamos-ios/Host/StikDebugRequest.swift steamos-ios/tests/RecoveryJournalTests.swift -o /tmp/mpc-recovery-tests
          /tmp/mpc-recovery-tests /tmp/mpc-capture-tests
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Isteamos-ios/Host steamos-ios/Host/GuestGPUReceipt.mm steamos-ios/tests/GuestGPUReceiptTests.mm -o /tmp/mpc-guest-gpu-receipt-tests
          /tmp/mpc-guest-gpu-receipt-tests
          clang++ -std=c++17 -Isteamos-ios/Host steamos-ios/tests/GuestMetalTraceLedgerTests.cpp -o /tmp/mpc-metal-ledger-tests
          /tmp/mpc-metal-ledger-tests
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Isteamos-ios/Host steamos-ios/tests/QEMUInitThreadLeaseTests.cpp -o /tmp/mpc-rcu-lease-tests
          /tmp/mpc-rcu-lease-tests
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -Isteamos-ios/Host steamos-ios/tests/QEMUInitThreadLeaseTests.cpp -o /tmp/mpc-rcu-lease-sanitized
          /tmp/mpc-rcu-lease-sanitized
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Isteamos-ios/Host steamos-ios/Host/GuestImageReceipt.mm steamos-ios/tests/GuestImageReceiptTests.mm -o /tmp/mpc-image-receipt-tests
          /tmp/mpc-image-receipt-tests
          clang -std=c11 -O2 -Wall -Wextra -Werror steamos-ios/tests/ImagePixelContractTests.c -o /tmp/mpc-image-pixel-tests
          /tmp/mpc-image-pixel-tests
          clang -std=c11 -O2 -Wall -Wextra -Werror steamos-ios/tests/GuestImageReadbackBudgetTests.c -o /tmp/mpc-image-budget-tests
          /tmp/mpc-image-budget-tests
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Isteamos-ios/Host steamos-ios/Host/GuestScreenReceipt.mm steamos-ios/tests/GuestScreenReceiptTests.mm -o /tmp/mpc-screen-receipt-tests
          /tmp/mpc-screen-receipt-tests
          clang -std=c11 -O2 -Wall -Wextra -Werror steamos-ios/tests/FramePixelContractTests.c -o /tmp/mpc-frame-pixel-tests
          /tmp/mpc-frame-pixel-tests
          clang -std=c11 -O2 -Wall -Wextra -Werror steamos-ios/tests/GuestFrameBudgetTests.c -o /tmp/mpc-frame-budget-tests
          /tmp/mpc-frame-budget-tests
          clang++ -std=c++17 -fobjc-arc -framework Foundation -Isteamos-ios/Host steamos-ios/Host/GuestFrameReceipt.mm steamos-ios/Host/GuestFrameScreenReceipt.mm steamos-ios/tests/GuestFrameReceiptTests.mm -o /tmp/mpc-frame-receipt-tests
          /tmp/mpc-frame-receipt-tests
      - name: Compile fresh physical iOS Release ARM64 host
        run: |
          python3 steamos-ios/tests/validate_sources.py
          xcodebuild -project steamos-ios/MyPCSteamOS.xcodeproj -scheme MyPCSteamOSProbe \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath steamos-ios/out/xcode CODE_SIGNING_ALLOWED=NO \
            MPC_SOURCE_COMMIT="$GITHUB_SHA" build
      - name: Bundle exact engine closure and disposable Linux payloads
        run: |
          mkdir -p steamos-ios/out/package/Payload
          cp -R steamos-ios/out/xcode/Build/Products/Release-iphoneos/MyPCSteamOSProbe.app steamos-ios/out/package/Payload/
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0,'steamos-ios/tools')
          from bundle_linux_gate import verify_assets, extract_checked
          guest=pathlib.Path('steamos-ios/out/cpu-guest-artifact')
          verify_assets(guest,['Linux-Gate-Payload.tar.gz','Linux-Gate-Corresponding-Source.tar.gz'])
          extract_checked(guest/'Linux-Gate-Payload.tar.gz',pathlib.Path('steamos-ios/out/package/Payload/MyPCSteamOSProbe.app/LinuxGate'))
          PY
          python3 steamos-ios/tools/bundle_native_vulkan.py bundle steamos-ios/out/package/Payload/MyPCSteamOSProbe.app
          python3 steamos-ios/tools/bundle_guest_gpu.py steamos-ios/out/gpu-engine-artifact steamos-ios/out/gpu-guest-artifact steamos-ios/out/package/Payload/MyPCSteamOSProbe.app
          python3 - <<'PY'
          import io, pathlib, tarfile
          app=pathlib.Path('steamos-ios/out/package/Payload/MyPCSteamOSProbe.app')
          with tarfile.open('steamos-ios/out/gpu-engine-artifact/GPU-Engine-Corresponding-Source.tar.gz') as outer:
              candidates=[m for m in outer.getmembers() if m.isfile() and m.name.endswith('/qemu-10.0.12-utm.tar.xz')]
              assert len(candidates)==1
              with tarfile.open(fileobj=io.BytesIO(outer.extractfile(candidates[0]).read())) as inner:
                  copying=[m for m in inner.getmembers() if m.isfile() and m.name.endswith('/COPYING') and len(pathlib.PurePosixPath(m.name).parts)==2]
                  assert len(copying)==1
                  (app/'QEMU-COPYING').write_bytes(inner.extractfile(copying[0]).read())
          (app/'Fresh-Source-LICENSE').write_bytes(pathlib.Path('steamos-ios/LICENSE').read_bytes())
          (app/'UPSTREAM-NOTICES.txt').write_text('QEMU/Linux/BusyBox GPL; glibc LGPL; GCC runtime exceptions; ANGLE BSD and per-file licenses; virgl/epoxy/Mesa MIT and per-file licenses; MoltenVK/Vulkan loader Apache-2.0 and dependency licenses. Exact originals, patches, build configuration, package copyright notices and corresponding source accompany this prerelease. The fresh host MIT license does not replace upstream licenses. No Valve client or game content is distributed.\n')
          PY
          (cd steamos-ios/out/package && zip -qr MyPCSteamOS-Guest-GPU-Gate.ipa Payload)
          python3 steamos-ios/tools/verify_ipa.py steamos-ios/out/package/MyPCSteamOS-Guest-GPU-Gate.ipa "$GITHUB_SHA" --linux-gate --native-vulkan --guest-gpu --build 4000025 --receipt steamos-ios/out/package/verification.json
          python3 steamos-ios/tools/verify_host_symbols.py steamos-ios/out/package/MyPCSteamOS-Guest-GPU-Gate.ipa steamos-ios/out/xcode/Build/Products/Release-iphoneos/MyPCSteamOSProbe.app.dSYM/Contents/Resources/DWARF/MyPCSteamOSProbe "$GITHUB_SHA" 4000025 --receipt steamos-ios/out/package/host-symbols.json
          tar -czf steamos-ios/out/package/Host-Debug-Symbols.tar.gz -C steamos-ios/out/xcode/Build/Products/Release-iphoneos MyPCSteamOSProbe.app.dSYM
          cp steamos-ios/out/gpu-engine-artifact/GPU-Engine-Corresponding-Source.tar.gz steamos-ios/out/package/
          cp steamos-ios/out/gpu-guest-artifact/Guest-GPU-Corresponding-Source.tar.gz steamos-ios/out/package/
          cp steamos-ios/out/cpu-guest-artifact/Linux-Gate-Corresponding-Source.tar.gz steamos-ios/out/package/
          cp steamos-ios/out/graphics-artifact/MoltenVK-Corresponding-Source.tar.gz steamos-ios/out/package/
          git archive --format=tar.gz -o steamos-ios/out/package/MyPCSteamOS-Fresh-Source.tar.gz HEAD steamos-ios ':(glob).github/workflows/steamos-*.yml'
          cp *-run.json steamos-ios/out/package/
          (cd steamos-ios/out/package && shasum -a 256 *.ipa *.tar.gz *.json > SHA256SUMS)
      - name: Publish verified prerelease and redownload it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="steamos-ios-guest-gpu-gate-${GITHUB_RUN_NUMBER}"
          cat > steamos-ios/out/package/release-notes.md <<'EOF'
          Build 4000025 corrects the QEMU initialization-thread lifetime in the fresh host. The pinned shared-library qemu_init registers the calling thread with RCU. The previous adapter allowed its std::thread to exit without unregistering that TLS reader. The new native engine exports the original upstream rcu_unregister_thread API. The host calls it on the same initialized thread after cleanup, lock release and autorelease-pool drain, before publishing retirement and joining the worker. This corrects an identified source bug; elimination of phone crashes is not yet verified.

          Native thread/TLS regression tests exercise explicit and destructor retirement, exception unwind, missing/double/wrong-thread calls, and an omitted-retirement negative control. Optimized and address/undefined-behavior-sanitized executions are required. They test the host lease contract, not execution of QEMU on iOS. The actual physical ARM64 iOS engine is independently audited for its defined retirement export and compiled RCU source. The package rejects private/string-only/undefined exports; device report validation requires an observed successful same-thread retirement and joined worker. Display timestamps still require actual positive callback values.

          The guest eight-frame payload, Mesa/Venus, renderer, native image ABI and MoltenVK observer remain pinned. QEMU and its dependency closure are rebuilt with the unchanged source recipe plus this narrow export. Automatic local MetricKit crash capture and matching host dSYM retention continue. No private phone logs, previous applications, credentials, Valve client or game content are included.

          This is a crash-fix candidate, not a new desktop/game milestone. Install with iLoader, enable JIT using StikDebug, and run one eight-frame screen test in a fresh app process. Leave the completed result open for 30 seconds so a delayed cleanup failure can be captured; then share report and saved logs. QEMU TCG remains software system emulation. Continuous moving-output transport, full SteamOS desktop/Game Mode/ARM Steam, FEX/Proton, input/audio/downloads/overlays/plugins and all game/startup/sustained-performance targets remain unfinished. Original licenses and complete corresponding source accompany the native packages.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "My-pc Linux guest Vulkan gate ${GITHUB_RUN_NUMBER}" --notes-file steamos-ios/out/package/release-notes.md \
            steamos-ios/out/package/MyPCSteamOS-Guest-GPU-Gate.ipa steamos-ios/out/package/verification.json \
            steamos-ios/out/package/SHA256SUMS steamos-ios/out/package/Host-Debug-Symbols.tar.gz steamos-ios/out/package/host-symbols.json steamos-ios/out/package/*-Source.tar.gz steamos-ios/out/package/*-run.json
          mkdir steamos-ios/out/redownload-guest-gpu
          gh release download "$tag" --dir steamos-ios/out/redownload-guest-gpu --pattern MyPCSteamOS-Guest-GPU-Gate.ipa
          cmp steamos-ios/out/package/MyPCSteamOS-Guest-GPU-Gate.ipa steamos-ios/out/redownload-guest-gpu/MyPCSteamOS-Guest-GPU-Gate.ipa
          python3 steamos-ios/tools/verify_ipa.py steamos-ios/out/redownload-guest-gpu/MyPCSteamOS-Guest-GPU-Gate.ipa "$GITHUB_SHA" --linux-gate --native-vulkan --guest-gpu --build 4000025
          gh release edit "$tag" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fresh-iPhone-Linux-Guest-GPU-Gate
          path: |
            steamos-ios/out/package/*.ipa
            steamos-ios/out/package/verification.json
            steamos-ios/out/package/host-symbols.json
            steamos-ios/out/package/Host-Debug-Symbols.tar.gz
            steamos-ios/out/package/SHA256SUMS
          retention-days: 14
