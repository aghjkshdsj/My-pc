name: Fresh source-built iOS ANGLE engine
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/tools/build_angle_ios.py', '.github/workflows/steamos-ios-angle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  angle-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/steamos-ios/out/angle-compiler-cache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Install strict compiler cache
        run: brew install ccache
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: steamos-ios/out/angle-compiler-cache
          key: ${{ runner.os }}-angle-ed78ab6-public-ios-strict-${{ hashFiles('steamos-ios/tools/build_angle_ios.py') }}
          restore-keys: ${{ runner.os }}-angle-ed78ab6-public-ios-strict-
      - name: Ensure Xcode Metal compiler is available
        run: |
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version
      - name: Build only pinned EGL and GLES engines with the public iOS SDK
        run: python3 steamos-ios/tools/build_angle_ios.py
      - name: Record compiler cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: steamos-ios/out/angle-compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fresh-iOS-ANGLE-Engine
          path: |
            steamos-ios/out/ios-angle/ANGLE-*.tar.gz
            steamos-ios/out/ios-angle/receipt.json
            steamos-ios/out/ios-angle/*-exports.txt
            steamos-ios/out/ios-angle/xcodebuild.log
            steamos-ios/out/ios-angle/public-ios-angle.patch
          retention-days: 14
