name: Experimental ARM Linux Metal graphics
on:
  push:
    branches: [codex/steam-arm-linux]
    paths: [.github/workflows/steam-arm-gpu.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ANGLE virgl (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: gpu-cache
        with:
          path: build/linux-arm-gpu/output/${{ matrix.platform }}
          key: arm-metal-v2-${{ matrix.platform }}-${{ hashFiles('build/linux-arm-gpu/prepare-gpu.py', 'build/linux-arm-gpu/patch-qemu.py', 'build/linux-arm-gpu/build.sh', 'build/linux-arm/prepare-utm.py', 'build/linux-arm/qemu-display.inc.c', 'build/linux-arm/host-launcher.c', 'app/Madeira/LinuxVMBridge.*') }}
      - name: Install build tools
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        run: |
          brew install bison pkg-config gettext glib meson ninja
          echo "$(brew --prefix bison)/bin:$(brew --prefix gettext)/bin:$(brew --prefix glib)/bin" >> "$GITHUB_PATH"
          python3 -m venv build/gpu-venv
          build/gpu-venv/bin/pip install six pyparsing pyyaml setuptools distlib mako packaging
          echo "$PWD/build/gpu-venv/bin" >> "$GITHUB_PATH"
      - name: Compile experimental Metal graphics framework
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        run: bash build/linux-arm-gpu/build.sh '${{ matrix.platform }}'
      - uses: actions/cache/save@v4
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        with:
          path: build/linux-arm-gpu/output/${{ matrix.platform }}
          key: ${{ steps.gpu-cache.outputs.cache-primary-key }}
      - name: Package cached framework
        if: steps.gpu-cache.outputs.cache-hit == 'true'
        run: |
          tar -czf 'build/linux-arm-gpu/output/experimental-gpu-${{ matrix.platform }}.tar.gz' -C 'build/linux-arm-gpu/output/${{ matrix.platform }}' .
      - name: Require actual ANGLE Metal context
        if: matrix.platform == 'macos'
        run: python3 build/linux-arm-gpu/probe-metal.py build/linux-arm-gpu/output/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-gpu-${{ matrix.platform }}
          path: build/linux-arm-gpu/output/experimental-gpu-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-gpu-logs-${{ matrix.platform }}
          path: |
            build/linux-arm-gpu/work-${{ matrix.platform }}/build.log
            build/linux-arm-gpu/work-${{ matrix.platform }}/utm/build-*/**/meson-logs/meson-log.txt
            build/linux-arm-gpu/output/${{ matrix.platform }}/metal-probe.log
            build/linux-arm-gpu/output/${{ matrix.platform }}/host-displays.log
            build/linux-arm-gpu/output/${{ matrix.platform }}/host-metal.log
