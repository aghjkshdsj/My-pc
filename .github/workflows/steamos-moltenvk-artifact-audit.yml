name: Exact compiled iOS graphics engine audit
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/tools/audit_moltenvk_artifact.py', '.github/workflows/steamos-moltenvk-artifact-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-exact-engine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Fresh-iOS-MoltenVK-Engine
          run-id: 37036404372
          github-token: ${{ github.token }}
          path: steamos-ios/out/moltenvk-audit
      - name: Verify exact hashes and classify required and weak iOS imports
        run: python3 steamos-ios/tools/audit_moltenvk_artifact.py steamos-ios/out/moltenvk-audit
      - uses: actions/upload-artifact@v4
        with:
          name: Exact-iOS-MoltenVK-Load-Command-Audit
          path: steamos-ios/out/moltenvk-audit/load-command-audit.json
