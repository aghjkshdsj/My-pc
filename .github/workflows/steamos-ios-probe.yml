name: Fresh SteamOS iOS host probe
on:
  push:
    branches: [codex/steamos-ios-fresh]
    paths: ['steamos-ios/Host/**', 'steamos-ios/MyPCSteamOS.xcodeproj/**', 'steamos-ios/tools/package_probe.sh', 'steamos-ios/tools/verify_ipa.py', '.github/workflows/steamos-ios-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steamos-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 steamos-ios/tests/validate_sources.py
      - name: Native Linux ABI smoke with sanitizers
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread steamos-ios/Guest/abi_probe.c -o /tmp/mpc-abi
          /tmp/mpc-abi
  iphone-build:
    needs: source-checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate project format
        run: |
          plutil -lint steamos-ios/MyPCSteamOS.xcodeproj/project.pbxproj steamos-ios/Host/Info.plist
          xcodebuild -list -project steamos-ios/MyPCSteamOS.xcodeproj
      - name: Compile fresh Release ARM64 iOS target
        run: |
          xcodebuild -project steamos-ios/MyPCSteamOS.xcodeproj -scheme MyPCSteamOSProbe \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath steamos-ios/out/xcode CODE_SIGNING_ALLOWED=NO \
            MPC_SOURCE_COMMIT="$GITHUB_SHA" build
      - name: Package and verify exact IPA
        run: bash steamos-ios/tools/package_probe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyPCSteamOS-Host-Probe
          path: |
            steamos-ios/out/package/MyPCSteamOS-Probe.ipa
            steamos-ios/out/package/verification.json
            steamos-ios/out/package/SHA256SUMS
          retention-days: 14
      - name: Collect corresponding fresh source
        run: |
          git archive --format=tar.gz -o steamos-ios/out/package/MyPCSteamOS-Probe-Sources.tar.gz HEAD steamos-ios .github/workflows/steamos-ios-probe.yml
          (cd steamos-ios/out/package && shasum -a 256 MyPCSteamOS-Probe.ipa MyPCSteamOS-Probe-Sources.tar.gz > SHA256SUMS)
      - name: Publish verified host probe prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="steamos-ios-host-probe-${GITHUB_RUN_NUMBER}"
          cat > steamos-ios/out/package/release-notes.md <<'EOF'
          Fresh ARM64 iOS host bring-up probe. This is unfinished SteamOS work.

          The separate app records physical device/OS facts and checks native Metal readback, a temporary host storage file and a local ARM64 JIT stub after StikDebug. Linux, SteamOS, Steam, FEX games and guest-to-Metal graphics are not yet implemented in this IPA. No performance target is claimed.

          Install with iLoader alongside older apps. Run Metal/storage, enable StikDebug for My-pc SteamOS Probe, then run the JIT check and share its device JSON. Existing projects and data remain untouched.

          The IPA is unsigned for device re-signing. Exact ARM64 iOS Mach-O, bundle/source identity and complete ZIP CRC are verified. Corresponding fresh source, checksum and verification receipt are attached.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "My-pc SteamOS fresh host probe ${GITHUB_RUN_NUMBER}" --notes-file steamos-ios/out/package/release-notes.md \
            steamos-ios/out/package/MyPCSteamOS-Probe.ipa steamos-ios/out/package/verification.json \
            steamos-ios/out/package/SHA256SUMS steamos-ios/out/package/MyPCSteamOS-Probe-Sources.tar.gz
          mkdir steamos-ios/out/redownload
          gh release download "$tag" --dir steamos-ios/out/redownload --pattern MyPCSteamOS-Probe.ipa
          cmp steamos-ios/out/package/MyPCSteamOS-Probe.ipa steamos-ios/out/redownload/MyPCSteamOS-Probe.ipa
          python3 steamos-ios/tools/verify_ipa.py steamos-ios/out/redownload/MyPCSteamOS-Probe.ipa "$GITHUB_SHA"
          gh release edit "$tag" --draft=false
    permissions:
      contents: write
